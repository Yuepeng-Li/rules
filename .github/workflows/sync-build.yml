name: Sync and Build Mihomo Rules

on:
  schedule:
    - cron: "0 19 * * *"

  workflow_dispatch:

  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  sync-build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Add upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/666OS/rules.git

      - name: Fetch upstream
        run: |
          git fetch upstream release

      - name: Sync txt only
        shell: bash
        run: |
            set +e

            TXT_FILES=$(git ls-tree -r --name-only upstream/release |
              grep '^mihomo/.*\.txt$')

            if [ -z "$TXT_FILES" ]; then
              echo "No txt files found in upstream/release, skipping."
              exit 0
            fi

            BASE=$(git merge-base HEAD upstream/release)

            HAS_CONFLICTS=0
            HAS_ERRORS=0

            while IFS= read -r f; do
              echo "Merging: $f"

              mkdir -p "$(dirname "$f")"

              if ! git show "upstream/release:$f" > /tmp/upstream_file; then
                echo "::error::Failed to read upstream file: $f"
                HAS_ERRORS=1
                continue
              fi

              if git cat-file -e "$BASE:$f" 2>/dev/null; then
                git show "$BASE:$f" > /tmp/base_file
              else
                > /tmp/base_file
              fi

              if [ -f "$f" ]; then
                git merge-file "$f" /tmp/base_file /tmp/upstream_file
                MERGE_STATUS=$?

                if [ "$MERGE_STATUS" -eq 0 ]; then
                  echo "Merged cleanly: $f"
                elif [ "$MERGE_STATUS" -le 127 ]; then
                  echo "::warning::Merge conflict in $f"
                  HAS_CONFLICTS=1
                else
                  echo "::error::git merge-file failed for $f, status=$MERGE_STATUS"
                  HAS_ERRORS=1
                fi
              else
                cp /tmp/upstream_file "$f"
                echo "Added upstream file: $f"
              fi
            done <<< "$TXT_FILES"

            if [ "$HAS_CONFLICTS" -eq 1 ]; then
              echo "::warning::Some files contain merge conflict markers."
            fi

            if [ "$HAS_ERRORS" -eq 1 ]; then
              echo "::error::One or more files could not be processed."
              exit 1
            fi

            exit 0
      - name: Apply comment rules
        run: |
          python comment_github_from_microsoft.py

      - name: Download Mihomo
        run: |
          mkdir -p tools

          VERSION=v1.19.26

          curl -L \
            -o tools/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz

          gzip -d tools/mihomo.gz

          chmod +x tools/mihomo

      - name: Build domain mrs
        run: |
          find mihomo/domain -name "*.txt" | while read f
          do
            tools/mihomo convert-ruleset domain text "$f" "${f%.txt}.mrs"
          done

      - name: Build ip mrs
        run: |
          find mihomo/ip -name "*.txt" | while read f
          do
            tools/mihomo convert-ruleset ipcidr text "$f" "${f%.txt}.mrs"
          done

      - name: Commit
        run: |
          git add mihomo

          git diff --cached --quiet || \
          git commit -m "auto update rules"

      - name: Push
        run: |
          git push origin release
